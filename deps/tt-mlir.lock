# Pinned tt-mlir release. The released Python wheel is the only prebuilt
# tt-mlir artifact, so this release is both the TTIR syntax contract and the
# parser used to validate emitted TTIR. The annotated tag points at the commit
# below, and every fixture URL is built from that commit so the file contents
# cannot drift when a nightly tag is rebuilt.
#
# Update the tag, the wheel digest, and the fixture digests together. Re-run
# scripts/fetch_ttmlir_fixtures.sh after any change; it verifies every digest.

TT_MLIR_TAG=0.9.0.dev20260221

# Annotated tag object and the commit it resolves to (git ls-remote --tags and
# the GitHub tags API agree). The release's target_commitish metadata records a
# different commit and is not the tree this pin uses.
TT_MLIR_TAG_OBJECT=f305713d0997b64f41420d3b2a948db0566e20a9
TT_MLIR_COMMIT=5f396fd6ef85780bf1b6b85bef9c7d2f84a85f3c

# Wheel: CPython 3.11, manylinux 2.34, x86_64. Contains ttmlir.ir, ttmlir.passmanager,
# and the ttcore, ttir, ttnn, d2m, ttkernel, and ttmetal dialects. There is no
# ttmlir-opt executable in the release, so the bindings are the only parser.
TT_MLIR_RELEASE_BASE=https://github.com/tenstorrent/tt-mlir/releases/download/0.9.0.dev20260221
TT_MLIR_WHEEL=ttmlir-0.9.0.dev20260221-cp311-cp311-manylinux_2_34_x86_64.whl
TT_MLIR_WHEEL_SHA256=37b8fd1e7ee1d12b1ba531df9e63038db3cbea97acab2f21547083b4a5bb962e

# Raw file source for the fixtures and the grammar definitions below.
TT_MLIR_RAW_BASE=https://raw.githubusercontent.com/tenstorrent/tt-mlir/5f396fd6ef85780bf1b6b85bef9c7d2f84a85f3c

