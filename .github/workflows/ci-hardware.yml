# Device acceptance. Runs only on a self-hosted runner that carries a
# Tenstorrent card and only when the pull request is labelled hardware.present.
# There is no CPU fallback in this workflow: a device job that cannot see a card
# fails here rather than silently passing elsewhere.
name: CI (hardware)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

jobs:
  on-device:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'hardware.present')
    runs-on: [self-hosted, tenstorrent]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "experimental-features = nix-command flakes"

      - name: Install devenv from the pinned nixpkgs revision
        run: |
          nix profile install "github:NixOS/nixpkgs/bd3c09ca2a2858daa15f26eb557faa4709635a41#devenv"

      - name: Probe the card
        run: devenv shell -- python3 scripts/device_probe.py

      - name: Fetch pinned tt-metal release artifacts
        run: devenv shell -- bash scripts/fetch_tt_metal.sh

      - name: Build the emitted project against the pinned runtime
        run: devenv shell -- bash scripts/build_generated.sh

      - name: Run on the device and check numerics
        run: devenv shell -- bash scripts/run_generated.sh --device
