# Device acceptance. Runs only on a self-hosted runner that carries a
# Tenstorrent card and only when the pull request is labelled hardware.present.
# There is no CPU fallback in this workflow: a device job that cannot see a card
# fails here rather than silently passing elsewhere.
name: CI (hardware)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

jobs:
  on-device:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'hardware.present')
    runs-on: [self-hosted, tenstorrent]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "experimental-features = nix-command flakes"

      - name: Install devenv from the pinned nixpkgs revision
        run: |
          nix profile install "github:NixOS/nixpkgs/bd3c09ca2a2858daa15f26eb557faa4709635a41#devenv"

      - name: Probe the card
        run: devenv shell -- python3 scripts/device_probe.py

      - name: Fetch pinned tt-metal release artifacts
        run: devenv shell -- bash scripts/fetch_tt_metal.sh

      - name: Run the acceptance script on every example
        # The script builds the compiler and each emitted project when needed,
        # runs all five examples with --device, and prints the Markdown table
        # for docs/device.md on stdout. Any failed example fails this job.
        run: |
          set -o pipefail
          devenv shell -- bash scripts/hardware_acceptance.sh | tee hardware-acceptance.md

      - name: Append the acceptance table to the job summary
        if: always()
        run: |
          if [ -s hardware-acceptance.md ]; then
            cat hardware-acceptance.md >> "$GITHUB_STEP_SUMMARY"
          fi
