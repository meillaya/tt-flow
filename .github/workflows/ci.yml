# CPU-only CI. Every step runs inside the devenv environment defined in
# devenv.nix; there is no flake and no ad-hoc package install.
name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "experimental-features = nix-command flakes"

      - name: Install devenv from the pinned nixpkgs revision
        run: |
          nix profile install "github:NixOS/nixpkgs/bd3c09ca2a2858daa15f26eb557faa4709635a41#devenv"

      - name: Fetch pinned tt-mlir fixtures
        run: devenv shell -- bash scripts/fetch_ttmlir_fixtures.sh

      - name: Build and test
        run: devenv shell -- bash scripts/test.sh

  emitted-project:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "experimental-features = nix-command flakes"

      - name: Install devenv from the pinned nixpkgs revision
        run: |
          nix profile install "github:NixOS/nixpkgs/bd3c09ca2a2858daa15f26eb557faa4709635a41#devenv"

      - name: Fetch pinned tt-metal release artifacts
        run: devenv shell -- bash scripts/fetch_tt_metal.sh

      - name: Compile and link an emitted project against real headers
        run: devenv shell -- bash scripts/build_generated.sh

      - name: Run the emitted project on the pinned simulator
        run: devenv shell -- bash scripts/run_generated.sh
